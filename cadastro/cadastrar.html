
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>
    <header>
        <h1>Cadastro de Usuário</h1>
    </header>
    <main>
        <form id="cadastroForm">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\{3}\-\{2}\" maxlength="14" oninput="formatarCPF(this)" placeholder="000.000.000.00" >
            <script>function formatarCPF(input) {
            let valor = input.value.replace(/\D/g,''); //  <= Remove tudo que não for digito yago
            if (valor.length > 11)valor = valor.slice(0, 11)

            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');

            input.value = valor;

            }</script> 

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" pattern="\(\d{2}\) \d{5}\-\d{4}\" oninput="formatarTel(this)" placeholder="(55) 00 00000-0000" required>
            <script>
                function formatarTel(input) {

                    let valor = input.value.replace(/\D/g, '');

                    if (valor.length > 11) {
                        valor = valor.slice(0, 11);
                    }

                    valor = valor.replace(/^(\d{2})(\d)/, '($1) $2');

                    valor = valor.replace(/(\d{5})(\d)/, '$1-$2');

                    input.value = valor;
                }
            </script>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="exemple123@gmail.com" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="confirmarSenha">Confirmar Senha:</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" required>

            <p id="mensagemErro" style="color: red;"></p>
            <button type="submit" onclick="Cadastrar()">Cadastrar</button>
            
        </form>
    </main>
    
        <p>&copy; 2026 VendaFácil. Todos os direitos reservados.</p> 
</body>
    <script src="cadastrar.js"></script>
</html>
